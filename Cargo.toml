[package]
name = "nyro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Nyro AI Gateway server"

[dependencies]
nyro-kernel = { path = "crates/nyro-kernel" }
nyro-config = { path = "crates/nyro-config" }
nyro-llm = { path = "crates/nyro-llm" }
nyro-security = { path = "crates/nyro-security" }
nyro-limit = { path = "crates/nyro-limit" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
axum.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http-body = "1"

[dev-dependencies]
async-trait.workspace = true
tower = { version = "0.5", features = ["util"] }

[workspace]
resolver = "2"
members = ["crates/nyro-protocol", "crates/nyro-security", "crates/nyro-limit", "crates/nyro-llm", "crates/nyro-config", "crates/nyro-kernel", "crates/nyro-core", "crates/nyro-tools", "src-tauri", "src-server"]

[workspace.package]
version = "1.8.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyroway/nyro"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-native-roots", "http2", "charset", "macos-system-configuration"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 3
