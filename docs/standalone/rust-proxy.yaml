server:
  listen: 127.0.0.1:19530
  request_timeout_ms: 120000
  max_body_bytes: 1048576
  max_response_bytes: 16777216
  max_frame_bytes: 1048576

llm:
  providers:
    example:
      kind: openai
      base_url: https://api.example.com/v1
      api_key: replace-with-provider-key
    responses-example:
      kind: openai
      api: responses
      base_url: https://api.example.com/v1
      api_key: replace-with-responses-key
    anthropic-example:
      kind: anthropic
      base_url: https://api.anthropic.com/v1
      api_key: replace-with-anthropic-key
    gemini-example:
      kind: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      api_key: replace-with-gemini-key
  models:
    responses-default:
      provider: responses-example
      upstream_model: example-responses-model
      workloads: [chat]
      subjects: [local-client]
    claude-default:
      provider: anthropic-example
      upstream_model: example-claude-model
      workloads: [chat]
      subjects: [local-client]
    gemini-default:
      provider: gemini-example
      upstream_model: example-gemini-model
      workloads: [chat]
      subjects: [local-client]
    chat-default:
      backends:
        - id: primary
          provider: example
          upstream_model: example-chat-model
          weight: 80
        - id: secondary
          provider: responses-example
          upstream_model: example-responses-model
          weight: 20
      workloads: [chat]
      allow_anonymous: false
      subjects: [local-client]
    embed-default:
      provider: example
      upstream_model: example-embedding-model
      workloads: [embedding]
      allow_anonymous: true

security:
  api_keys:
    - id: local-client
      secret: replace-with-client-secret

limit:
  concurrency: 64
